name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Nightly: standard-library CVEs are published independently of our commits,
  # so an unchanged repo can become vulnerable overnight.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# Least privilege: read the code, nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Oldest and newest supported Go, on Linux (CI/servers) and macOS
    # (engineer laptops) — process-group handling differs between them.
    if: github.event_name != 'schedule'
    name: test (go ${{ matrix.go }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        go: [oldstable, stable]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false # zero dependencies: nothing to cache, nothing to poison
      # gofmt's output can differ between Go releases, so formatting is
      # checked once, against the canonical (newest) formatter.
      - name: Format
        if: matrix.go == 'stable'
        run: make fmt-check
      - name: Vet and dependency policy
        run: make vet deps-check
      - name: Install pinned analysis tools
        run: make tools
      - name: Static analysis
        run: make lint
      - name: Tests (race detector)
        run: make test
      - name: End-to-end regression
        run: make e2e

  security:
    # Runs on every event, including the nightly schedule.
    name: vulnerabilities and release integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so `git describe` stamps a real version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # the toolchain releases are built with
          cache: false
      - name: Install pinned analysis tools
        run: make tools
      - name: govulncheck (our code and the standard library)
        run: make vuln
      - name: Reproducible build
        if: github.event_name != 'schedule'
        run: make repro
      - name: Cross-compile with checksums
        if: github.event_name != 'schedule'
        run: make checksums
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'schedule'
        with:
          name: bankctl-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
